# Construye NARSIL Pass para Windows y Linux (x86_64 y ARM64), cada uno en un runner de su sistema,
# comprueba el núcleo con --autoprueba y, con una etiqueta v*, publica la Release con SHA256SUMS.
# Acciones fijadas por SHA de commit (una etiqueta se puede mover; un SHA, no).
name: Construir ejecutables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Mínimo privilegio: solo publicar escribe. Pruebas y construcción ejecutan código de terceros
# (npm ci, pip, PyInstaller) y no deben tener un token con escritura sobre el repositorio.
permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas del núcleo contra KeePassXC
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: KeePassXC (oráculo de compatibilidad)
        run: sudo apt-get update && sudo apt-get install -y keepassxc
      - name: pytest
        run: |
          python -m pip install --quiet -r requirements-dev.txt pywebview==6.2.1 pip-audit
          python -m pytest
          python -m pip_audit -r requirements.txt -r empaquetado/requirements-build.txt

  construir:
    name: ${{ matrix.nombre }}
    needs: pruebas
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nombre: windows-x86_64, runner: windows-latest, artefacto: "dist/narsil-pass-windows-x86_64.exe" }
          - { nombre: linux-x86_64, runner: ubuntu-24.04, artefacto: "dist/narsil-pass-linux-x86_64" }
          - { nombre: linux-aarch64, runner: ubuntu-24.04-arm, artefacto: "dist/narsil-pass-linux-aarch64" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020    # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Interfaz
        run: npm ci && npm audit --audit-level=high && npm run build
        working-directory: ui
      - name: Pruebas de los modelos de la interfaz (ficha y listado)
        run: node scripts/prueba_identidad.mjs && node scripts/prueba_listado.mjs
      - name: WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1
      - name: Construir (Linux)
        if: runner.os == 'Linux'
        run: bash empaquetado/construir.sh
      - name: Construir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File empaquetado\construir.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.nombre }}
          path: ${{ matrix.artefacto }}
          if-no-files-found: error

  publicar:
    name: Release con sumas SHA-256
    needs: construir
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: artefactos
          merge-multiple: true
      - name: Sumas
        run: cd artefactos && ls -la && sha256sum * | tee SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: artefactos/*
          fail_on_unmatched_files: true
          generate_release_notes: true
